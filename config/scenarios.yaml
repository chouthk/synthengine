scenarios:
  home_safety:
    description: "家用機器人家居安全場景 — 典型香港住宅"
    prompts:
      - "嬰兒接近高溫電熱水壺，水壺放置在不穩定位置，電線懸垂"
      - "寵物突然穿過機器人路徑，導致機器人需即時改變力控策略"
      - "地板積水（寵物水碗打翻），機器人需檢測濕滑表面並調整行走參數"
      - "兒童將細小物件（如樂高）塞入機器人關節縫隙"
      - "長者在家中跌倒，機器人需識別並提供緊急援助"

  driving:
    description: "自動駕駛極端邊界場景 — 香港道路環境"
    prompts:
      - "暴雨夜間，前車突然掉落大型貨物，能見度低於50米"
      - "市區窄路，兒童從停泊車輛之間突然衝出（鬼探頭）"
      - "大霧天氣，行人胡亂橫過馬路，無行人過路燈"
      - "電單車在車流中穿插，突然切入本車前方"
      - "隧道內發生火警，前車急煞，濃煙阻礙視覺鏡頭"
